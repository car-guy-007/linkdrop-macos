name: Build LinkDrop macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compile universal native Mac app
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          mkdir -p build/arm64 build/amd64
          xcrun swiftc -O -parse-as-library -target arm64-apple-macos13.0 -sdk "$SDK" \
            -o build/arm64/LinkDrop LinkDrop.swift
          xcrun swiftc -O -parse-as-library -target x86_64-apple-macos13.0 -sdk "$SDK" \
            -o build/amd64/LinkDrop LinkDrop.swift
          APP="build/LinkDrop.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create build/arm64/LinkDrop build/amd64/LinkDrop \
            -output "$APP/Contents/MacOS/LinkDrop"
          chmod +x "$APP/Contents/MacOS/LinkDrop"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>LinkDrop</string>
            <key>CFBundleIdentifier</key><string>app.linkdrop.macos</string>
            <key>CFBundleName</key><string>LinkDrop</string>
            <key>CFBundleDisplayName</key><string>LinkDrop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.2</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.video</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"

      - name: Package yt-dlp, FFmpeg and Deno
        shell: bash
        run: bash scripts/bundle-tools.sh build/LinkDrop.app

      - name: Validate architecture and sign application
        shell: bash
        run: |
          set -euo pipefail
          APP="build/LinkDrop.app"
          test -x "$APP/Contents/MacOS/LinkDrop"
          test -x "$APP/Contents/Resources/tools/yt-dlp_macos"
          for arch in arm64 amd64; do
            test -x "$APP/Contents/Resources/tools/$arch/ffmpeg"
            test -x "$APP/Contents/Resources/tools/$arch/ffprobe"
            test -x "$APP/Contents/Resources/tools/$arch/deno"
          done
          lipo -archs "$APP/Contents/MacOS/LinkDrop"
          for tool in "$APP/Contents/Resources/tools/yt-dlp_macos" \
                      "$APP"/Contents/Resources/tools/{arm64,amd64}/{deno,ffmpeg,ffprobe}; do
            codesign --force --sign - "$tool"
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"

      - name: Smoke test app launches on macOS
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/LinkDrop.app"
          LOG="$RUNNER_TEMP/linkdrop-launch.log"
          "$APP/Contents/MacOS/LinkDrop" > "$LOG" 2>&1 &
          PID=$!
          sleep 12
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::LinkDrop exited or crashed during startup"
            cat "$LOG"
            ls -lt ~/Library/Logs/DiagnosticReports/LinkDrop* 2>/dev/null | head || true
            exit 1
          fi
          echo "LinkDrop remained running for 12 seconds — startup smoke test passed."
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Zip downloadable app
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build/LinkDrop.app LinkDrop-macOS.zip

      - name: Create and verify drag-to-Applications DMG
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/linkdrop-installer"
          MOUNT="$RUNNER_TEMP/linkdrop-installer-check"
          mkdir -p "$STAGE" "$MOUNT"
          ditto build/LinkDrop.app "$STAGE/LinkDrop.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "LinkDrop" -srcfolder "$STAGE" \
            -format UDZO -imagekey zlib-level=9 -ov LinkDrop-macOS.dmg
          hdiutil verify LinkDrop-macOS.dmg
          hdiutil attach -readonly -nobrowse -quiet \
            -mountpoint "$MOUNT" LinkDrop-macOS.dmg
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          test -x "$MOUNT/LinkDrop.app/Contents/MacOS/LinkDrop"
          test "$(readlink "$MOUNT/Applications")" = "/Applications"
          codesign --verify --deep --verbose=2 "$MOUNT/LinkDrop.app"
          cmp build/LinkDrop.app/Contents/MacOS/LinkDrop \
              "$MOUNT/LinkDrop.app/Contents/MacOS/LinkDrop"
          hdiutil detach "$MOUNT" -quiet
          trap - EXIT
          echo "DMG mount, signature and contents verified."

      - name: Upload DMG and ZIP installers
        uses: actions/upload-artifact@v6
        with:
          name: LinkDrop-macOS
          path: |
            LinkDrop-macOS.dmg
            LinkDrop-macOS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent Mac app release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 LinkDrop-macOS.dmg LinkDrop-macOS.zip --clobber
          else
            gh release create v1.0.2 LinkDrop-macOS.dmg LinkDrop-macOS.zip \
              --title "LinkDrop for macOS 1.0.2" \
              --notes "Native macOS app for Apple Silicon and Intel (macOS 13+). Download the DMG, open it and drag LinkDrop.app to Applications. The app is ad-hoc signed but not Apple-notarized, so the first launch may require approval under System Settings > Privacy & Security > Open Anyway. Download videos only where you have permission; DRM is not bypassed."
          fi
